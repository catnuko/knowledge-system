<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  input { width: 100%; padding: 6px 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 6px 14px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #1d4ed8; }
  .hint { margin-top: 10px; font-size: 12px; color: #888; line-height: 1.5; }
  .ok { color: #16a34a; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
  <label for="endpoint">knowledge-engine 后端地址</label>
  <input id="endpoint" placeholder="http://127.0.0.1:8000">
  <button id="save">保存</button>
  <div class="hint">选中网页文本 → 右键 → "采集到 knowledge-engine"。</div>
  <div class="ok" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
