# 发版自动化（release-please）：
# - 日常 push 到 main 后，根据 Conventional Commits（feat/fix/…）自动维护发版 PR；
# - 发版 PR 会自动升级版本号（pyproject.toml / desktop/package.json /
#   desktop/src-tauri/tauri.conf.json / Cargo.toml）并追加 CHANGELOG.md；
# - 该 PR 合并时自动创建 tag vX.Y.Z 与 GitHub Release（含发布说明），
#   并在同一个工作流运行内构建桌面端产物上传到该 Release。
#   （注意：不能依赖 tag push 事件触发单独的打包工作流——GITHUB_TOKEN
#    创建的 tag/release 不会级联触发其他 workflow，因此打包必须内联在此处。）
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        run: bash desktop/scripts/build-backend.sh

      - name: Place backend binary as Tauri resource
        run: |
          mkdir -p desktop/src-tauri/resources
          cp desktop/backend-dist/knowledge-engine-backend desktop/src-tauri/resources/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app (app + dmg)
        working-directory: desktop
        run: |
          # dmg 打包依赖 AppleScript，个别环境会失败；失败则降级为仅 .app
          npx tauri build --config src-tauri/configs/macos/tauri.macos.conf.json \
            || npx tauri build --config src-tauri/configs/macos/tauri.macos.conf.json --bundles app

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          mv desktop/src-tauri/target/release/bundle/macos/knowledge-engine.app artifacts/
          if ls desktop/src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null; then
            mv desktop/src-tauri/target/release/bundle/dmg/*.dmg "artifacts/knowledge-engine_${GITHUB_REF_NAME}_aarch64.dmg"
          fi
          cd artifacts && zip -ry "knowledge-engine_${GITHUB_REF_NAME}_macos_app.zip" knowledge-engine.app && rm -rf knowledge-engine.app
          ls -la

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: artifacts/*

  build-windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        shell: bash
        run: bash desktop/scripts/build-backend.sh

      - name: Place backend binary as Tauri resource
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          cp desktop/backend-dist/knowledge-engine-backend.exe desktop/src-tauri/resources/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app (nsis + msi)
        working-directory: desktop
        run: npx tauri build --config src-tauri/configs/windows/tauri.windows.conf.json

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe artifacts/
          cp desktop/src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: artifacts/*
