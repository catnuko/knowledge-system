# 桌面端打包与发布：push v* tag（通常由 release-please 发版 PR 合并产生）时，
# 在 macOS runner 上构建后端（PyInstaller）+ Tauri 壳（.app / .dmg），
# 并把产物上传到同名 GitHub Release（release notes 由 GitHub 自动生成）。
# 也支持 workflow_dispatch 手动触发（此时不创建 Release，仅上传构建工件）。
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        run: bash desktop/scripts/build-backend.sh

      - name: Place backend binary as Tauri resource
        run: |
          mkdir -p desktop/src-tauri/resources
          cp desktop/backend-dist/knowledge-engine-backend desktop/src-tauri/resources/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri app (app + dmg)
        working-directory: desktop
        run: |
          # dmg 打包依赖 AppleScript，个别环境会失败；失败则降级为仅 .app
          npx tauri build --config src-tauri/configs/macos/tauri.macos.conf.json \
            || npx tauri build --config src-tauri/configs/macos/tauri.macos.conf.json --bundles app

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          mv desktop/src-tauri/target/release/bundle/macos/knowledge-engine.app artifacts/
          if ls desktop/src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null; then
            mv desktop/src-tauri/target/release/bundle/dmg/*.dmg "artifacts/knowledge-engine_${GITHUB_REF_NAME}_aarch64.dmg"
          fi
          cd artifacts && zip -ry "knowledge-engine_${GITHUB_REF_NAME}_macos_app.zip" knowledge-engine.app && rm -rf knowledge-engine.app
          ls -la

      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: artifacts/

      - name: Attach to GitHub Release (tag push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
