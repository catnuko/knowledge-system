# Nginx 静态部署示例：web/dist 由 Nginx 托管，/api 反向代理到本地后端。
# 部署步骤：
#   1. bash web/build.sh
#   2. 把 web/dist 上传到服务器，替换下面 root 路径
#   3. 把 /api 反代指向运行中的后端（ke serve --port 8000）
server {
    listen 80;
    server_name _;

    root /var/www/knowledge-engine/dist;
    index index.html;

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
