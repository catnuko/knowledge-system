[project]
name = "secondme"
version = "0.2.0"
description = "SecondMe · 第二个我 — Personal knowledge network: multi-source capture → AI atomization → scientific knowledge graph (Zettelkasten + KST + FSRS)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.9",
    "fsrs>=6.3.2",
    "trafilatura>=2.2.0",
    "jieba>=0.42.1",
    "fastapi>=0.116",
    "uvicorn>=0.40",
    "pydantic>=2.0",
    "requests>=2.31",
    "python-multipart>=0.0.9",
]

[project.scripts]
ke = "knowledge_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_engine*"]
