[project]
name = "knowledge-engine"
version = "0.2.0"
description = "个人知识系统：多源采集 → AI 原子化 → 科学知识网络（Zettelkasten + KST + FSRS）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.9",
    "fsrs>=6.3.2",
    "trafilatura>=2.2.0",
    "jieba>=0.42.1",
    "fastapi>=0.116",
    "uvicorn>=0.40",
    "pydantic>=2.0",
    "requests>=2.31",
    "python-multipart>=0.0.9",
]

[project.scripts]
ke = "knowledge_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_engine*"]
