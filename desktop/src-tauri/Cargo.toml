[package]
name = "knowledge-engine-desktop"
version = "0.1.0"
description = "knowledge-engine 桌面端：Tauri v2 壳 + 本地 Python 后端（ke serve）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "knowledge_engine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
